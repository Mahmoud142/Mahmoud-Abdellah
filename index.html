<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Mahmoud Abdellah is a software engineer building full-stack web applications, scalable APIs, and user-focused digital products." />
    <title>Mahmoud Abdellah</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Signal dark color-scheme preference to browsers & in-app webviews -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0C10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script>
        (function () {
            var DARK_BG = '#0B0C10';
            var LIGHT_BG = '#F9FAFB';
            var savedTheme = localStorage.getItem('portfolio-theme') || 'dark';
            var bg = savedTheme === 'light' ? LIGHT_BG : DARK_BG;

            document.documentElement.setAttribute('data-theme', savedTheme);
            // Force background immediately — prevents white flash in in-app browsers
            document.documentElement.style.backgroundColor = bg;
            document.documentElement.style.setProperty('background-color', bg, 'important');
            // Also set on body as soon as it exists
            if (document.body) {
                document.body.style.setProperty('background-color', bg, 'important');
            } else {
                document.addEventListener('DOMContentLoaded', function () {
                    if (document.body) {
                        document.body.style.setProperty('background-color',
                            document.documentElement.getAttribute('data-theme') === 'light' ? LIGHT_BG : DARK_BG,
                            'important');
                    }
                });
            }
            // Update the theme-color meta tag for address bar
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', bg);
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
